<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trading Chart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0b0f14;--panel:#111821;--line:#1f2833;--tx:#d1d7e0;--mut:#7d8896;--g:#26a69a;--r:#ef5350;--y:#f0b90b;--b:#4aa3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.35 Segoe UI,Arial,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:280px 5px 1fr 5px 360px;height:100vh}
aside{background:var(--panel);overflow:auto;min-width:0;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:transparent transparent}
aside:hover{scrollbar-color:#2c3647 transparent}
.hdl{background:var(--line);cursor:col-resize;overflow:hidden}
.hdl:hover,.hdl.drag{background:#3b6fb0}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
button{background:#1b2431;color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:4px 9px;cursor:pointer;font-size:12px}
button:hover{background:#243044}
button.on{background:#2b3a52;border-color:#3b5378;color:#fff}
input{background:#0b0f14;border:1px solid var(--line);color:var(--tx);border-radius:4px;padding:4px 7px;font-size:12px}
#sym{width:140px;font-weight:600}
#live{margin-left:auto;color:var(--mut);font-size:12px}
#charts{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.pane{position:relative;min-height:0;border-top:1px solid var(--line)}
#p1{flex:5}#p2{flex:1.3}#p3{flex:1.4}#p4{flex:1.7}
#legend{position:absolute;left:10px;top:6px;z-index:5;pointer-events:none;font-size:12px;text-shadow:0 0 3px #000}
#legend b{color:#fff}
#msg{position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:6;color:var(--mut)}
#dtools{position:absolute;left:6px;top:72px;z-index:8;display:grid;grid-template-columns:30px 30px;gap:3px;background:#111821ee;border:1px solid var(--line);border-radius:6px;padding:4px}
#dtools button{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center}
#dtools svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#dtools input[type=color]{width:30px;height:30px;padding:2px;border-radius:4px;cursor:pointer}
h4{margin:0;padding:8px 10px;font-size:12px;letter-spacing:.5px;color:var(--mut);text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.hi{padding:7px 10px;border-bottom:1px solid #161e29}
.hi .n{display:flex;align-items:center;gap:7px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#555;flex:none}
.ok .dot{background:var(--g)}.warn .dot{background:var(--y)}.bad .dot{background:var(--r)}.idle .dot{background:#555}
.hi .d{color:var(--mut);font-size:12px;margin:2px 0 0 16px}
.hi .h{color:#f3a;font-size:12px;margin:3px 0 0 16px}
.hi button{margin:5px 0 0 16px}
.err{font:11px/1.3 Consolas,monospace;color:#c9a;padding:6px 10px;border-bottom:1px solid #161e29;word-break:break-all}
#sum{padding:8px 10px;font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border-radius:0;border:0;border-bottom:2px solid transparent;background:none;padding:9px}
.tabs button.on{border-bottom-color:var(--b);color:#fff;background:none}
.row{display:grid;grid-template-columns:28px 1fr 52px 48px;gap:4px;padding:5px 10px;cursor:pointer;border-bottom:1px solid #161e29;align-items:center}
.row:hover{background:#17202c}.row.sel{background:#1d2a3b}
.row .s{font-weight:600}.row .m{color:var(--mut);text-align:right;font-size:12px}
.tag{font-size:11px;padding:1px 5px;border-radius:3px;text-align:center}
.LONG{background:#12332f;color:var(--g)}.SHORT{background:#3a1a1a;color:var(--r)}
.sec{padding:6px 10px;color:var(--mut);font-size:11px;background:#0e141c}
.note{padding:14px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:4px 8px;border-bottom:1px solid #161e29;text-align:left}

/* Detailed terminal panes: compact rows, responsive horizontal scrolling */
#right{overflow:hidden}
#tab-watch,#tab-signal{overflow:auto;min-height:0;flex:1;scrollbar-width:thin}
#tab-pos{display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden;height:100%}
.pos-split-open{height:40%;display:flex;flex-direction:column;overflow:hidden;border-bottom:2px solid #1c2736}
.pos-split-history{height:60%;display:flex;flex-direction:column;overflow:hidden;flex:1}
.pos-split-open .terminal-table-wrap, .pos-split-history .terminal-table-wrap{flex:1;overflow:auto;scrollbar-width:thin}
.terminal-table-wrap{width:100%;overflow-x:auto;scrollbar-width:thin}

/* Left sidebar Journal: 30% Summary Card, 70% 7-day Journal Table */
#left{overflow:hidden}
#ltab-health{overflow:auto;min-height:0;flex:1;scrollbar-width:thin}
#ltab-journal{display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden;height:100%}
.journal-split-summary{height:30%;min-height:175px;display:flex;flex-direction:column;overflow:hidden;border-bottom:2px solid #1c2736;background:#0d131a}
.journal-split-history{height:70%;display:flex;flex-direction:column;overflow:hidden;flex:1;background:#0f1621}
.journal-split-summary .sum-wrap{flex:1;overflow:auto;scrollbar-width:thin;padding:8px}
.journal-split-history .table-wrap{flex:1;overflow:auto;scrollbar-width:thin}

.jcard-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.jcard{background:#141d28;border:1px solid #1f2c3d;border-radius:5px;padding:6px 8px}
.jcard.full{grid-column:1 / -1}
.jcard small{display:block;font-size:10px;color:#8595a8;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.jcard .val{font-size:13px;font-weight:700;color:#f0f5fb;font-variant-numeric:tabular-nums}
.jcard .sub{font-size:10px;color:#8595a8;margin-top:2px}

.jbar{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 9px;background:#141f2d;border-bottom:1px solid #202f42}
.jbar strong{font-size:11px;color:#e7f0fb;letter-spacing:.3px}
.jselect{background:#0c121a;border:1px solid #26384c;color:#cbd5e1;font-size:11px;padding:3px 6px;border-radius:4px;outline:none;max-width:170px}

/* Watch table: responsive and fluid with sidebar width */
.watch-table{border-collapse:collapse;width:100%;min-width:100%;font-size:11px;font-variant-numeric:tabular-nums;table-layout:auto}
.watch-table th{position:sticky;top:0;background:#172230;color:#91a3b8;text-transform:uppercase;font-size:10px;letter-spacing:.3px;z-index:1;white-space:nowrap;padding:6px 5px}
.watch-table td{padding:5px 5px;white-space:nowrap;color:#cdd8e8;border-bottom:1px solid #1b2937}
.watch-table th:nth-child(1), .watch-table td:nth-child(1){width:24px;text-align:center}
.watch-table th:nth-child(2), .watch-table td:nth-child(2){font-weight:700;color:#f0f5fb;min-width:70px}
.watch-table th:nth-child(3), .watch-table td:nth-child(3){text-align:center;width:42px}
.watch-table th:nth-child(4), .watch-table td:nth-child(4){text-align:right;min-width:38px}
.watch-table th:nth-child(5), .watch-table td:nth-child(5){text-align:right;min-width:38px}
.watch-table th:nth-child(6), .watch-table td:nth-child(6){text-align:right;min-width:52px}
.watch-table th:nth-child(7), .watch-table td:nth-child(7){text-align:right;min-width:38px}
.watch-table tbody tr[data-s]{cursor:pointer}.watch-table tbody tr[data-s]:hover{background:#1d3042}.watch-table tbody tr.sel{background:#20334a}
.watch-table .num{text-align:right}.watch-table td.muted{color:#8195ac}.watch-table .symname{font-weight:700;color:#f0f5fb}
.watch-table .detail-row td{white-space:normal;background:#101c2b;padding:10px;line-height:1.6}
.watch-table .detail-row{cursor:default}

/* Position table: fully responsive to sidebar widening / shrinking (barano/komano) */
.pos-table{border-collapse:collapse;width:100%;min-width:100%;font-size:11px;font-variant-numeric:tabular-nums;table-layout:auto}
.pos-table th{position:sticky;top:0;background:#172230;color:#91a3b8;text-transform:uppercase;font-size:10px;letter-spacing:.3px;z-index:1;white-space:nowrap;padding:6px 6px}
.pos-table td{padding:6px 6px;white-space:nowrap;color:#cdd8e8;border-bottom:1px solid #1b2937}
.pos-table th.col-sym, .pos-table td.col-sym{font-weight:700;color:#f0f5fb;min-width:75px}
.pos-table th.col-side, .pos-table td.col-side{text-align:center;width:48px}
.pos-table th.col-entry, .pos-table td.col-entry{text-align:right;min-width:58px}
.pos-table th.col-mark, .pos-table td.col-mark{text-align:right;min-width:58px}
.pos-table th.col-sl, .pos-table td.col-sl{text-align:right;min-width:52px}
.pos-table th.col-tp, .pos-table td.col-tp{text-align:right;min-width:52px}
.pos-table th.col-pnl, .pos-table td.col-pnl{text-align:right;font-weight:700;min-width:54px}
.pos-table th.col-status, .pos-table td.col-status{text-align:center;min-width:55px;font-size:10px}
.pos-table tbody tr[data-pos-index]{cursor:pointer}.pos-table tbody tr[data-pos-index]:hover{background:#1d3042}
.pos-table .num{text-align:right}
.pos-table .detail-row td{white-space:normal;background:#101c2b;padding:10px;line-height:1.6}
.pos-table .detail-row{cursor:default}

.terminal-table{border-collapse:collapse;width:100%;min-width:100%;font-size:11px;font-variant-numeric:tabular-nums;table-layout:auto}
.terminal-table th{position:sticky;top:0;background:#172230;color:#91a3b8;text-transform:uppercase;font-size:10px;letter-spacing:.3px;z-index:1;white-space:nowrap;padding:6px 4px}
.terminal-table td{padding:5px 4px;white-space:nowrap;color:#cdd8e8;border-bottom:1px solid #1b2937}
.terminal-table tbody tr[data-s]{cursor:pointer}.terminal-table tbody tr[data-s]:hover{background:#1d3042}.terminal-table tbody tr.sel{background:#20334a}
.terminal-table .num{text-align:right}.terminal-table td.muted{color:#8195ac}.terminal-table .symname{font-weight:700;color:#f0f5fb}
.terminal-table .detail-row td{white-space:normal;background:#101c2b;padding:10px;line-height:1.6}
.terminal-table .detail-row{cursor:default}.details-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px}
.details-grid .k{color:#8da2ba}.details-grid .v{color:#e4edf8;overflow-wrap:anywhere}
.positive{color:#29c9a3!important}.negative{color:#f77a80!important}.dim{color:#8195ac!important}
.signal-stack{padding:8px;display:flex;flex-direction:column;gap:9px}
.sig-card{background:#131e2b;border:1px solid #26384c;border-radius:7px;padding:11px}
.sig-head,.sig-meta,.sig-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sig-symbol{font-size:14px;font-weight:700;color:#f3f7fc}.sig-meta{margin-top:4px;font-size:11px;color:#94a8c0;flex-wrap:wrap}
.sig-prices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:10px}
.sig-price{min-width:0;border:1px solid #25364a;border-radius:4px;padding:6px;background:#101a27}
.sig-price small{display:block;color:#8b9db4;font-size:10px;margin-bottom:4px}.sig-price strong{font-size:12px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sig-foot{margin-top:9px;padding-top:9px;border-top:1px solid #27384c;font-size:11px;color:#9fb3ca}
.sig-card details{border-top:1px solid #263649;margin-top:9px;padding-top:8px;font-size:11px;color:#b0c3d9}
.sig-card summary{cursor:pointer;color:#71b6fa}.sig-reason{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:7px}
.section-toolbar{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;color:#9cb1c9;font-size:11px;background:#0e1723;border-bottom:1px solid #243143}
.section-toolbar strong{color:#e7f0fb;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <aside id="left">
    <div class="tabs" id="ltabs">
      <button data-lt="health" class="on">Engine Health</button>
      <button data-lt="journal">Trading Journal</button>
    </div>
    <div id="ltab-health">
      <h4>Engine Health <span><button id="btnTest">Test</button></span></h4>
      <div id="sum">...</div>
      <div id="hitems"></div>
      <h4>Errors / Warnings (log)</h4>
      <div id="errs"></div>
      <h4>Fix jobs</h4>
      <div id="jobs" class="note">-</div>
    </div>
    <div id="ltab-journal" style="display:none">
      <div class="journal-split-summary" id="journalSummary">
        <div class="section-toolbar"><strong>📊 DAILY SUMMARY CARD</strong><span style="color:#4aa3ff">30% Height</span></div>
        <div class="sum-wrap" id="jSummaryWrap">Loading summary...</div>
      </div>
      <div class="journal-split-history" id="journalHistory">
        <div class="jbar">
          <strong>📜 7-DAY JOURNAL</strong>
          <select id="jday" class="jselect"></select>
        </div>
        <div class="table-wrap" id="jTableWrap">Loading journal...</div>
      </div>
    </div>
  </aside>
  <div class="hdl" id="hl" title="Drag = size, Double-click = reset"></div>

  <main>
    <div id="top">
      <button id="tl" title="Bam sidebar">&#9664;</button>
      <input id="sym" list="ulist" spellcheck="false"><datalist id="ulist"></datalist>
      <span id="tfs"></span>
      <span>
        <button class="on" data-i="ema">EMA</button>
        <button class="on" data-i="vol">Volume</button>
        <button class="on" data-i="rsi">RSI</button>
        <button class="on" data-i="macd">MACD</button>
        <button id="btnAnalysis" style="background:#2b4c7e;border-color:#4a80c9;color:#fff;font-weight:700;margin-left:4px">⚡ Analysis</button>
      </span>
      <span id="live">-</span>
      <button id="tr" title="Dan sidebar">&#9654;</button>
    </div>
    <div id="charts">
      <div id="legend"></div><div id="msg"></div>
      <div id="dtools">
        <button data-tool="cursor" class="on" title="Cursor (Esc)"><svg viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></svg></button>
        <button data-tool="trend" title="Trend line"><svg viewBox="0 0 24 24"><path d="M4 19L20 5"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="5" r="2"/></svg></button>
        <button data-tool="ray" title="Ray"><svg viewBox="0 0 24 24"><path d="M4 18L21 6"/><circle cx="4" cy="18" r="2"/><path d="M16 5h5v5"/></svg></button>
        <button data-tool="hline" title="Horizontal line"><svg viewBox="0 0 24 24"><path d="M3 12h18"/><circle cx="12" cy="12" r="2"/></svg></button>
        <button data-tool="vline" title="Vertical line"><svg viewBox="0 0 24 24"><path d="M12 3v18"/><circle cx="12" cy="12" r="2"/></svg></button>
        <button data-tool="rect" title="Rectangle"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
        <button data-tool="fib" title="Fib retracement"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 14h16M4 19h16"/></svg></button>
        <button data-tool="measure" title="Measure"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M15 5h4v4M9 19H5v-4"/></svg></button>
        <button data-tool="text" title="Text"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M9 19h6"/></svg></button>
        <button data-tool="eraser" title="Eraser (drawing er upor click = delete)"><svg viewBox="0 0 24 24"><path d="M4 16l8-9 8 7-5 5H8zM10 19h10"/></svg></button>
        <button id="dMagnet" title="Magnet (candle OHLC e snap)"><svg viewBox="0 0 24 24"><path d="M6 4v8a6 6 0 0012 0V4h-4v8a2 2 0 01-4 0V4z"/></svg></button>
        <button id="dUndo" title="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
        <button id="dClear" title="Clear all (ei symbol er)"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg></button>
        <input type="color" id="dColor" value="#f0b90b" title="Color">
      </div>
      <div class="pane" id="p1"></div>
      <div class="pane" id="p2"></div>
      <div class="pane" id="p3"></div>
      <div class="pane" id="p4"></div>
    </div>
  </main>

  <div class="hdl" id="hr" title="Drag = size, Double-click = reset"></div>
  <aside id="right">
    <div class="tabs">
      <button data-t="watch" class="on">Watch</button>
      <button data-t="signal">Signal</button>
      <button data-t="pos">Position</button>
    </div>
    <div id="tab-watch"></div>
    <div id="tab-signal" style="display:none"></div>
    <div id="tab-pos" style="display:none"></div>
  </aside>
</div>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const $ = s => document.querySelector(s);
const SHIFT = 21600;
let sym = localStorage.getItem('sym') || 'BTCUSDT';
let tf = localStorage.getItem('tf') || '15m';
const TFS = ['15m','1h','4h','1d'];
const STEP = {'15m':900,'1h':3600,'4h':14400,'1d':86400};

// ---------- sidebar size + hide
const app = document.getElementById('app');
let LWd = +localStorage.getItem('lw') || 300, RWd = +localStorage.getItem('rw') || 340;
let hideL = localStorage.getItem('hl') === '1', hideR = localStorage.getItem('hr') === '1';
function cols() {
  app.style.gridTemplateColumns = `${hideL ? 0 : LWd}px ${hideL ? 0 : 5}px 1fr ${hideR ? 0 : 5}px ${hideR ? 0 : RWd}px`;
}
function dragHandle(el, side) {
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId); el.classList.add('drag'); document.body.style.userSelect = 'none';
    const mv = ev => {
      if (side === 'l') LWd = Math.max(200, Math.min(700, ev.clientX));
      else RWd = Math.max(220, Math.min(760, window.innerWidth - ev.clientX));
      cols();
    };
    const up = ev => {
      try { el.releasePointerCapture(ev.pointerId); } catch (x) {}
      el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up);
      el.classList.remove('drag'); document.body.style.userSelect = '';
      localStorage.setItem(side === 'l' ? 'lw' : 'rw', side === 'l' ? LWd : RWd);
    };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
  });
  el.addEventListener('dblclick', () => {
    if (side === 'l') { LWd = 300; localStorage.setItem('lw', 300); } else { RWd = 340; localStorage.setItem('rw', 340); }
    cols();
  });
}
dragHandle(document.getElementById('hl'), 'l');
dragHandle(document.getElementById('hr'), 'r');
$('#tl').onclick = () => { hideL = !hideL; localStorage.setItem('hl', hideL ? '1' : '0'); cols(); };
$('#tr').onclick = () => { hideR = !hideR; localStorage.setItem('hr', hideR ? '1' : '0'); cols(); };
cols();

// ---------- charts
const LW = LightweightCharts;
const base = {
  autoSize: true,
  layout: {background:{color:'#0b0f14'}, textColor:'#9aa5b4'},
  grid: {vertLines:{color:'#151c26'}, horzLines:{color:'#151c26'}},
  crosshair: {mode: LW.CrosshairMode.Normal},
  rightPriceScale: {borderColor:'#252e3a', minimumWidth: 72},
  timeScale: {borderColor:'#252e3a', timeVisible:true, secondsVisible:false, rightOffset:6}
};
const ids = ['p1','p2','p3','p4'];
const charts = ids.map(id => LW.createChart(document.getElementById(id), JSON.parse(JSON.stringify(base))));

const candleS = charts[0].addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
const ema20S = charts[0].addLineSeries({color:'#f0b90b',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
const ema50S = charts[0].addLineSeries({color:'#4aa3ff',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
const volS = charts[1].addHistogramSeries({priceFormat:{type:'volume'},priceLineVisible:false});
const vmaS = charts[1].addLineSeries({color:'#f0b90b',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
const rsiS = charts[2].addLineSeries({color:'#b28dff',lineWidth:1,priceLineVisible:false});
rsiS.createPriceLine({price:70,color:'#666',lineStyle:2,lineWidth:1,axisLabelVisible:true,title:''});
rsiS.createPriceLine({price:30,color:'#666',lineStyle:2,lineWidth:1,axisLabelVisible:true,title:''});
const macdH = charts[3].addHistogramSeries({priceLineVisible:false,lastValueVisible:false});
const macdL = charts[3].addLineSeries({color:'#4aa3ff',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
const sigL = charts[3].addLineSeries({color:'#f0b90b',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
const mains = [candleS, volS, rsiS, macdL];
// Chart axis follows requested display precision without changing candle data.
function setPriceDisplay(referencePrice) {
  const digits = priceDigits(referencePrice);
  const priceFormat = {type:'custom', minMove: digits === 5 ? 0.00000001 : 0.00000001,
    formatter: value => Number(value).toFixed(digits)};
  [candleS, ema20S, ema50S].forEach(series => series.applyOptions({priceFormat}));
}
function restorePriceAutoScale() {
  // Reset manual price-axis zoom inherited from the preceding symbol.
  charts[0].priceScale('right').applyOptions({autoScale:true});
}


let syncing = false;
charts.forEach((c,i) => c.timeScale().subscribeVisibleLogicalRangeChange(r => {

async function load(fit) {
  const loadId = ++candleLoadId, requestedSymbol = sym, requestedTf = tf;
  let d;
  try {
    const res = await fetch(`/api/candles?symbol=${encodeURIComponent(requestedSymbol)}&interval=${encodeURIComponent(requestedTf)}&limit=600`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    d = await res.json();
  } catch (e) {

  if (loadId !== candleLoadId || requestedSymbol !== sym || requestedTf !== tf) return;
  if (!d.candles || !d.candles.length) { $('#msg').textContent = sym + ' ' + tf + ': DB te data nai'; return; }
  $('#msg').textContent = '';
  setPriceDisplay(d.candles[d.candles.length - 1].close);

  times = d.candles.map(x => x.time);
  lastT = times[times.length - 1];
  lines.forEach(l => { try { candleS.removePriceLine(l); } catch(e) {} });
  lines = [];
  const lv = d.levels || {};
  if (lv.support) lines.push(candleS.createPriceLine({price:lv.support,color:'#26a69a',lineStyle:2,lineWidth:1,axisLabelVisible:true,title:'Support'}));
  if (lv.resistance) lines.push(candleS.createPriceLine({price:lv.resistance,color:'#ef5350',lineStyle:2,lineWidth:1,axisLabelVisible:true,title:'Resist'}));
  if (fit) {
    restorePriceAutoScale();
    const n = d.candles.length;
    charts[0].timeScale().setVisibleLogicalRange({from:Math.max(0,n-130), to:n+6});
  }
  legend(lastT); ver++;
}

function tToL(t) {

  return lo + (t - times[lo]) / (times[lo + 1] - times[lo]);
}
function lToT(l) {

  if (l <= 0) return times[0] + l * st;
  const i = Math.floor(l);
  return times[i] + (l - i) * (times[i + 1] - times[i]);
}
function px(p) {

}
const fmtP = p => priceText(p);

}

  let t = lToT(l), p = price;

}

      cx.strokeRect(Math.min(A.x, B.x), Math.min(A.y, B.y), Math.abs(B.x - A.x), Math.abs(B.y - A.y));
      cx.setLineDash([]); ln(A, B); dot(A); dot(B);

function dseg(mx, my, A, B) {

// Output encoding prevents external API values from injecting HTML.
const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const pick = (obj, ...keys) => {
  for (const k of keys) {
    if (obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
  }
  return null;
};
const fmt = (value, decimals=1) => {
  if (value === null || value === undefined || value === '') return '—';
  const n = Number(value);
  if (Number.isFinite(n)) {
    // If value is exactly 0 or near 0, format cleanly
    return Math.abs(n) < 0.0001 ? '0.0' : n.toFixed(decimals);
  }
  return esc(value);
};
const raw = value => (value === null || value === undefined || value === '') ? '—' : esc(value);
const directional = side => String(side || '').toUpperCase() === 'LONG' ? 'positive' : String(side || '').toUpperCase() === 'SHORT' ? 'negative' : '';
const humanKey = key => key.replace(/_/g,' ').replace(/\b\w/g, m => m.toUpperCase());
const extraDetails = (obj, ignored=[]) => {
  const keys = Object.keys(obj || {}).filter(k => !ignored.includes(k) && obj[k] != null && obj[k] !== '');
  if (!keys.length) return '<span class="dim">Additional details not returned by API.</span>';
  return `<div class="details-grid">${keys.map(k => `<div><span class="k">${esc(humanKey(k))}:</span> <span class="v">${raw(typeof obj[k] === 'object' ? JSON.stringify(obj[k]) : obj[k])}</span></div>`).join('')}</div>`;
};
function fmtVol(v) {
  if (v == null || isNaN(v) || v <= 0) return '-';
  if (v >= 1e9) return '$' + (v / 1e9).toFixed(1) + 'B';
  if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return '$' + (v / 1e3).toFixed(1) + 'K';
  return '$' + Number(v).toFixed(0);
}
const watchCols = [
  ['#',r => raw(r.rank)],

];

function signalCard(r) {
  const symbol = pick(r,'symbol','coin') || 'UNKNOWN';
  const side = pick(r,'side','direction') || '—';
  const strat = pick(r,'strategy','strategy_name','setup','pattern') || 'Strategy not provided';
  const entry = pick(r,'entry_price','entry','price','signal_price');
  const sl = pick(r,'stop_loss','sl','stop_price');
  const tp = pick(r,'take_profit','tp','tp_price');
  const action = pick(r,'action','status','execution_status') || '—';
  const when = pick(r,'created_at','signal_time','timestamp','time','ts') || '—';
  const reason = pick(r,'reason','note','details','message','why');
  const rank = pick(r,'rank','watch_rank','ranking');
  const atr = pick(r,'atr','atr_15m');
  const risk = Number(entry) && Number(sl) ? Math.abs(Number(entry)-Number(sl)) : null;
  const reward = tp != null && entry != null ? Math.abs(Number(tp)-Number(entry)) : null;
  const rr = risk && reward != null && Number.isFinite(reward/risk) ? (reward/risk).toFixed(2)+':1' : '—';
  const ignored = ['symbol','coin','side','direction','strategy','strategy_name','setup','pattern','entry_price','entry','price','signal_price','stop_loss','sl','stop_price','take_profit','tp','tp_price','action','status','execution_status','created_at','signal_time','timestamp','time','ts','reason','note','details','message','why','rank','watch_rank','ranking','atr','atr_15m'];
  return `<article class="sig-card">
    <div class="sig-head"><span class="sig-symbol">${raw(symbol)}</span><span class="tag ${esc(String(side).toUpperCase())}">${raw(side)}</span></div>
    <div class="sig-meta"><span>${raw(strat)}</span><span>${raw(when)}</span></div>
    <div class="sig-prices"><div class="sig-price"><small>ENTRY</small><strong>${entry == null?'—':priceText(entry)}</strong></div><div class="sig-price"><small>STOP LOSS</small><strong class="negative">${sl == null?'—':priceText(sl)}</strong></div><div class="sig-price"><small>TAKE PROFIT</small><strong class="positive">${tp == null?'—':priceText(tp)}</strong></div></div>
    <div class="sig-foot"><span>Rank ${raw(rank)}</span><span>ATR ${raw(atr)}</span><span>R:R ${rr}</span><span>${raw(action)}</span></div>
    <details><summary>Strategy reason &amp; execution details</summary><div class="sig-reason">${reason == null ? 'Reason not returned by API.' : raw(reason)}</div>${extraDetails(r,ignored)}</details>
  </article>`;
}
